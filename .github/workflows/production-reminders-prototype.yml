name: Prototype production reminders (disabled until configured)
on:
  schedule:
    # 06:50 UTC = 12:20 IST; GitHub schedules may be delayed.
    - cron: '50 6 * * 1-5'
  workflow_dispatch:
jobs:
  preview-reminders:
    concurrency:
      group: production-reminders-daily
      cancel-in-progress: false
    if: ${{ vars.ENABLE_PRODUCTION_REMINDERS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependencies
        run: python -m pip install openpyxl requests
      - name: Read current shared workbook and optionally send
        env:
          WORKBOOK_PATH: ${{ vars.PRODUCTION_WORKBOOK_PATH }}
          WORKBOOK_SHARE_URL: ${{ vars.WORKBOOK_SHARE_URL }}
          SEND_ENABLED: ${{ vars.SEND_ENABLED }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python reminder-addin/scheduled_reminders.py
